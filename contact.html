<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact - Miletic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Contact Mihajlo Miletic" />
  <link rel="preload" href="style.css" as="style" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="window-system.css" />
</head>
<body>
  <main class="window-page-stage">
    <article class="landing-window" aria-label="Contact page window">
      <div class="landing-window-dragbar" aria-hidden="true"></div>
      <span class="landing-window-title">Contact</span>
      <div class="window-content">
        <h1>Let us build something together.</h1>
        <p>Use the form below and I will get back to you.</p>

        <form id="contactForm" class="page-contact-form">
          <input type="text" name="name" placeholder="Your name" required />
          <input type="email" name="email" placeholder="Your email" required />
          <textarea name="message" placeholder="Your message" rows="7" required></textarea>
          <button
            type="button"
            id="inputFontToggle"
            class="input-font-toggle load-more"
            aria-pressed="false"
            title="Switch between retro and default font in message fields"
          >
            input font: retro
          </button>
          <button type="submit" class="load-more">Send</button>
        </form>

        <p id="status" class="status" aria-live="polite"></p>

      </div>
    </article>
  </main>

  <script src="window-system.js"></script>
  <script>
    const form = document.getElementById('contactForm');
    const status = document.getElementById('status');
    const inputFontToggle = document.getElementById('inputFontToggle');
    const inputFontPreferenceKey = 'contactInputDefaultFont';

    const setInputFontMode = (useDefaultFont) => {
      form.classList.toggle('default-input-font', useDefaultFont);
      inputFontToggle.setAttribute('aria-pressed', useDefaultFont ? 'true' : 'false');
      inputFontToggle.textContent = useDefaultFont ? 'input font: default' : 'input font: retro';
      localStorage.setItem(inputFontPreferenceKey, useDefaultFont ? 'true' : 'false');
    };

    const prefersDefaultFont = localStorage.getItem(inputFontPreferenceKey) === 'true';
    setInputFontMode(prefersDefaultFont);

    inputFontToggle.addEventListener('click', () => {
      const currentlyDefault = form.classList.contains('default-input-font');
      setInputFontMode(!currentlyDefault);
    });

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      status.textContent = 'Sending...';

      const formData = new FormData(form);

      fetch('https://script.google.com/macros/s/AKfycbzeR-Ek8bIuNkkl87gBWiwdDVFGjLB-jfzYOjAYjLCxL3Co9UZ7GjrRqCh8xpKa4HBQUw/exec', {
        method: 'POST',
        body: formData
      })
      .then((response) => response.text())
      .then(() => {
        status.textContent = 'Message sent. Thank you!';
        form.reset();
      })
      .catch(() => {
        status.textContent = 'Error sending message.';
      });
    });
  </script>
</body>
</html>
