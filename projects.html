<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Projects – Miletic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* Critical nav paint to prevent first-frame flashes before style.css is ready. */
    body { margin: 0; background: #1a2233; color: #e6edf3; }
    .site-nav { position: sticky; top: 0; z-index: 1100; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.08); background: linear-gradient(90deg, rgba(11,16,27,0.98), rgba(8,13,24,0.98)); }
    .site-nav-inner { width: min(100% - 40px, 1800px); margin: 0 auto; min-height: 86px; display: flex; align-items: center; justify-content: flex-start; position: relative; }
    .site-logo { color: #f5f7fb; text-decoration: none; font-family: "Times New Roman", Georgia, serif; font-size: clamp(2.25rem, 3vw, 3.1rem); line-height: 1; }
    .site-nav-links { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 2rem; }
    .site-nav-links a { color: rgba(240,243,248,0.66); text-decoration: none; font-size: 1.01rem; }
  </style>
  <link rel="preload" href="style.css" as="style" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="projects-page">
  <nav class="site-nav" id="siteNav" aria-label="Primary">
    <div class="site-nav-inner">
      <a href="index.html" class="site-logo">miletic</a>
      <div class="site-nav-links">
        <a href="index.html" id="nav-home">Home</a>
        <a href="about.html" id="nav-about">About</a>
        <a href="projects.html" id="nav-projects">Projects</a>
        <a href="contact.html" id="nav-contact">Contact</a>
      </div>
    </div>
  </nav>
  <header>
    <h1>My Projects</h1>
    <a href="index.html" class="hero-button">Back to Home</a>
  </header>
  <main>
    <section>
      <h2>Find Projects</h2>
      <div class="project-tools">
        <input id="projectSearch" class="search-input" type="search" placeholder="Search by title or description" aria-label="Search projects" />
        <div class="filter-chip-row" role="group" aria-label="Filter projects by section">
          <button class="filter-chip active" data-filter="all">All</button>
          <button class="filter-chip" data-filter="mockups">Mock Ups</button>
          <button class="filter-chip" data-filter="hoodies">Hoodies</button>
          <button class="filter-chip" data-filter="personalprojects">Personal Projects</button>
        </div>
      </div>
      <p id="noProjectResults" class="empty-state" hidden>No projects matched your current filters.</p>
    </section>
    <section id="mockups">
      <h2>Mock Ups</h2>
      <div class="sort-controls">
        <label>Sort by: 
          <select id="sortSelector">
            <option value="date">Date</option>
            <option value="alpha">Alphabetical</option>
          </select>
        </label>
      </div>
      <div class="projects-grid" id="projects-grid-mockups">
        <!-- generated articles -->
      </div>
      <button class="load-more" data-section="mockups">Load more</button>
    </section>
    <section id="socialmedia">
      <h2>Social Media</h2>
      <div class="projects-grid">
        <!-- Add your social media project articles here -->
      </div>
    </section>
    <section id="hoodies">
      <h2>Hoodies</h2>
      <div class="projects-grid" id="projects-grid-hoodies">
        <!-- generated hoodies articles -->
      </div>
      <button class="load-more" data-section="hoodies">Load more</button>
    </section>
    <section id="personalprojects">
      <h2>Personal Projects</h2>
      <div class="projects-grid" id="projects-grid-personalprojects">
        <!-- generated personal project articles -->
      </div>
      <button class="load-more" data-section="personalprojects">Load more</button>
    </section>
  </main>
  <footer>
    <p>© <span id="year"></span> Mihajlo Miletic</p>
  </footer>
  <script src="projects-data.js"></script>
  <script>
    const styleClassMap = {
      default: '',
      poster: 'card-style-poster',
      crt: 'card-style-crt'
    };
    const colorThemeMap = {
      default: '',
      lilac: 'theme-lilac',
      sunset: 'theme-sunset',
      mint: 'theme-mint',
      night: 'theme-night'
    };
    const preferredCardStyle = localStorage.getItem('preferredCardStyle');
    if (preferredCardStyle && styleClassMap[preferredCardStyle]) {
      document.body.classList.add(styleClassMap[preferredCardStyle]);
    }
    const preferredColorTheme = localStorage.getItem('preferredColorTheme');
    if (preferredColorTheme && colorThemeMap[preferredColorTheme]) {
      document.body.classList.add(colorThemeMap[preferredColorTheme]);
    }

    const retroSoundEnabled = localStorage.getItem('retroSoundEnabled') === 'true';
    let audioContext = null;
    let lastBeepAt = 0;

    const ensureAudioContext = () => {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          return null;
        }
        audioContext = new AudioContextClass();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
      return audioContext;
    };

    const playRetroBeep = () => {
      if (!retroSoundEnabled || !document.body.classList.contains('card-style-poster')) {
        return;
      }
      const now = performance.now();
      if (now - lastBeepAt < 85) {
        return;
      }
      lastBeepAt = now;

      const context = ensureAudioContext();
      if (!context || context.state !== 'running') {
        return;
      }

      const oscillator = context.createOscillator();
      const gainNode = context.createGain();
      oscillator.type = 'square';
      oscillator.frequency.setValueAtTime(880, context.currentTime);
      oscillator.frequency.setValueAtTime(620, context.currentTime + 0.035);
      gainNode.gain.setValueAtTime(0.0001, context.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.035, context.currentTime + 0.01);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.08);
      oscillator.connect(gainNode);
      gainNode.connect(context.destination);
      oscillator.start();
      oscillator.stop(context.currentTime + 0.09);
    };

    document.addEventListener('pointerover', (event) => {
      const currentTarget = event.target.closest('a,button,input,select,textarea,.filter-chip,.hero-button');
      if (!currentTarget) {
        return;
      }
      const previousTarget = event.relatedTarget && event.relatedTarget.closest
        ? event.relatedTarget.closest('a,button,input,select,textarea,.filter-chip,.hero-button')
        : null;
      if (currentTarget === previousTarget) {
        return;
      }
      playRetroBeep();
    });

    document.addEventListener('focusin', (event) => {
      if (event.target.closest('a,button,input,select,textarea,.filter-chip,.hero-button')) {
        playRetroBeep();
      }
    });

    document.getElementById('year').textContent = new Date().getFullYear();
    const siteNav = document.getElementById('siteNav');
    const updateNavScrollState = () => {
      siteNav.classList.toggle('scrolled', window.scrollY > 8);
    };
    updateNavScrollState();
    window.addEventListener('scroll', updateNavScrollState, { passive: true });
    // Highlight current page in burger menu
    const path = window.location.pathname.split('/').pop();
    if (path === '' || path === 'index.html') {
      document.getElementById('nav-home').classList.add('active-page');
    } else if (path === 'projects.html') {
      document.getElementById('nav-projects').classList.add('active-page');
    } else if (path === 'about.html') {
      document.getElementById('nav-about').classList.add('active-page');
    } else if (path === 'contact.html') {
      document.getElementById('nav-contact').classList.add('active-page');
    }
    // render projects and add sorting
    const DISCIPLINE_MAP = {
      mockups: 'Product / UI',
      hoodies: 'Graphic / Apparel',
      personalprojects: 'Experiments'
    };
    const SECTION_TAGS = {
      mockups: ['0 to 1', 'UI', 'Concept'],
      hoodies: ['Graphic', 'Apparel', 'Print'],
      personalprojects: ['Visual Lab', 'Experiment', 'Story']
    };
    const SECTION_METRICS = {
      mockups: [
        { value: '8+', label: 'concept rounds' },
        { value: '3', label: 'design tools' }
      ],
      hoodies: [
        { value: '20+', label: 'print variants' },
        { value: '6', label: 'anime series' }
      ],
      personalprojects: [
        { value: '9+', label: 'worlds explored' },
        { value: '100%', label: 'self-directed' }
      ]
    };
    const HOODIE_DETAIL_PAGES = new Set([
      'kirby',
      'kira_alt',
      'jjk_gojo_alt',
      'csm',
      'berserk',
      'berserk_overlap_alt'
    ]);

    const SECTION_FOLDER_MAP = {
      mockups: 'mockups',
      personalprojects: 'passion',
      hoodies: 'hoodies'
    };

    const slugifyTitle = (title) => title
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '');

    const getProjectDetailLink = (project) => {
      if (project.section === 'hoodies') {
        const imageFile = project.img.split('/').pop() || '';
        const baseName = imageFile.replace(/\d+\.png$/i, '');
        if (HOODIE_DETAIL_PAGES.has(baseName)) {
          return `projects/hoodies/${baseName}.html`;
        }
      }

      const sectionFolder = SECTION_FOLDER_MAP[project.section];
      if (!sectionFolder) {
        return `projects.html#${project.section}`;
      }

      const projectSlug = slugifyTitle(project.title);
      return `projects/${sectionFolder}/${projectSlug}.html`;
    };

    const enrichProject = (project) => ({
      ...project,
      disciplineLabel: DISCIPLINE_MAP[project.section] || 'Experiments',
      tags: SECTION_TAGS[project.section] || ['Design'],
      metrics: SECTION_METRICS[project.section] || [],
      caseStudyUrl: getProjectDetailLink(project),
      liveUrl: project.img
    });

    const renderProjectCard = (project) => {
      const art = document.createElement('article');
      art.setAttribute('data-date', project.date);
      let imgHtml = `<img src="${project.img}" alt="${project.title} project image" class="project-img ${project.imgClass}">`;
      if (project.section === 'hoodies') {
        imgHtml = `<a href="${project.caseStudyUrl}">${imgHtml}</a>`;
      }
      art.innerHTML = `<h3>${project.title}</h3>
        <p>${project.desc}</p>
        ${imgHtml}
        <div class="project-meta-row">
          <div class="tag-list"><span class="tag tag-discipline">${project.disciplineLabel}</span>${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
          <div class="metric-list">${project.metrics.map(metric => `<span class="metric"><strong>${metric.value}</strong> ${metric.label}</span>`).join('')}</div>
        </div>
        <div class="project-actions">
          <a href="${project.caseStudyUrl}" class="hero-button">View case study</a>
          <a href="${project.liveUrl}" class="hero-button" target="_blank" rel="noopener">View live</a>
        </div>`;
      return art;
    };

    const mockupsContainer = document.getElementById('projects-grid-mockups');
    function renderMockups(sortBy) {
      const items = PROJECTS.filter(p=>p.section==='mockups').slice();
      if (sortBy==='alpha') {
        items.sort((a,b)=> a.title.localeCompare(b.title));
      } else {
        items.sort((a,b)=> b.date.localeCompare(a.date));
      }
      mockupsContainer.innerHTML = '';
      items.forEach(p=>{
        const art = document.createElement('article');
        art.setAttribute('data-date', p.date);
        art.innerHTML = `<h3>${p.title}</h3>
          <img src="${p.img}" alt="${p.title} project image" class="project-img ${p.imgClass}">
          <p>${p.desc}</p>`;
        mockupsContainer.appendChild(art);
      });
    }
    // global state for pagination
    const visibleCounts = {
      mockups: 3,
      hoodies: 3,
      personalprojects: 3
    };
    let currentSort = 'date';
    let activeSectionFilter = 'all';
    let currentQuery = '';

    const searchableFields = (project) => `${project.title} ${project.desc}`.toLowerCase();

    function applySearchAndSectionFilters(items, section) {
      return items.filter(item => {
        const inSection = activeSectionFilter === 'all' || activeSectionFilter === section;
        const matchesQuery = !currentQuery || searchableFields(item).includes(currentQuery);
        return inSection && matchesQuery;
      });
    }

    function renderSection(section, containerId) {
      const container = document.getElementById(containerId);
      let items = PROJECTS.filter(p => p.section === section).slice();
      // for hoodies, only display the first ("1") image variant
      if (section === 'hoodies') {
        items = items.filter(p => p.img.match(/1\.png$/));
      }
      if (currentSort === 'alpha') {
        items.sort((a,b) => a.title.localeCompare(b.title));
      } else {
        items.sort((a,b) => b.date.localeCompare(a.date));
      }
      items = applySearchAndSectionFilters(items, section);
      const count = visibleCounts[section] || items.length;
      container.innerHTML = '';
      items.slice(0, count).forEach(p => {
        container.appendChild(renderProjectCard(enrichProject(p)));
      });
      // toggle load more button
      const button = document.querySelector(`button.load-more[data-section="${section}"]`);
      if (items.length <= count) {
        button.style.display = 'none';
      } else {
        button.style.display = 'block';
      }

      const sectionEl = document.getElementById(section);
      if (items.length === 0) {
        sectionEl.style.display = 'none';
      } else {
        sectionEl.style.display = 'block';
      }
    }

    function renderAll() {
      renderSection('mockups', 'projects-grid-mockups');
      renderSection('hoodies', 'projects-grid-hoodies');
      renderSection('personalprojects', 'projects-grid-personalprojects');

      const hasVisibleSection = ['mockups', 'hoodies', 'personalprojects']
        .some(sectionId => document.getElementById(sectionId).style.display !== 'none');
      document.getElementById('noProjectResults').hidden = hasVisibleSection;
    }

    document.getElementById('sortSelector').addEventListener('change', e => {
      currentSort = e.target.value;
      renderAll();
    });

    document.getElementById('projectSearch').addEventListener('input', (event) => {
      currentQuery = event.target.value.trim().toLowerCase();
      renderAll();
    });

    document.querySelectorAll('.filter-chip').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        activeSectionFilter = button.getAttribute('data-filter');
        renderAll();
      });
    });

    // setup load more buttons
    document.querySelectorAll('button.load-more').forEach(btn => {
      btn.addEventListener('click', () => {
        const sec = btn.getAttribute('data-section');
        visibleCounts[sec] = (visibleCounts[sec] || 0) + 6;
        renderSection(sec, `projects-grid-${sec}`);
      });
    });

    // initial render
    renderAll();
  </script>
  <script src="crt-reticle.js"></script>
</body>
</html>
