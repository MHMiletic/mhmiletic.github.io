<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Work - Miletic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Project gallery of Mihajlo Miletic" />
  <link rel="preload" href="style.css" as="style" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="window-system.css" />
</head>
<body>
  <main class="window-page-stage">
    <article class="landing-window" aria-label="Projects page window">
      <div class="landing-window-dragbar" aria-hidden="true"></div>
      <span class="landing-window-title">My Work</span>
      <div class="window-content">
        <h1>Selected projects</h1>
        <p>A dynamic overview linked to dedicated project pages.</p>

        <div class="projects-toolbar" aria-label="Project browsing controls">
          <div class="project-filter-row" role="tablist" aria-label="Project category filters">
            <button type="button" class="project-filter-chip is-active" data-filter="all">all</button>
            <button type="button" class="project-filter-chip" data-filter="mock-ups">mock ups</button>
            <button type="button" class="project-filter-chip" data-filter="advertisement-ish">advertisement-ish</button>
            <button type="button" class="project-filter-chip" data-filter="personal-projects">personal projects</button>
            <button type="button" class="project-filter-chip" data-filter="illustrations">illustrations</button>
            <button type="button" class="project-filter-chip" data-filter="graphical-designs">graphical Designs</button>
          </div>
          <label class="projects-sort-label" for="projectSort">sort</label>
          <select id="projectSort" class="projects-sort-select">
            <option value="date-desc">newest first</option>
            <option value="date-asc">oldest first</option>
            <option value="title-asc">title (a-z)</option>
          </select>
        </div>

        <section id="projectsGrid" class="page-project-grid" aria-label="Projects grid"></section>

      </div>
    </article>
  </main>

  <script src="projects-data.js"></script>
  <script src="window-system.js"></script>
  <script src="projects-browser.js"></script>
</body>
</html>
